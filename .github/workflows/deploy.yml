name: Deploy to Cloudflare Pages

on:
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write
    steps:
      - name: Validate required secrets
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          ADMIN_EMAIL: ${{ secrets.ADMIN_EMAIL }}
          ORGANIZATION_OWNER_EMAIL: ${{ secrets.ORGANIZATION_OWNER_EMAIL }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          APP_URL: ${{ secrets.APP_URL }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
        run: |
          missing=()
          [ -z "$CLOUDFLARE_API_TOKEN" ] && missing+=("CLOUDFLARE_API_TOKEN")
          [ -z "$CLOUDFLARE_ACCOUNT_ID" ] && missing+=("CLOUDFLARE_ACCOUNT_ID")
          [ -z "$ORGANIZATION_OWNER_EMAIL" ] && [ -z "$ADMIN_EMAIL" ] && missing+=("ORGANIZATION_OWNER_EMAIL or ADMIN_EMAIL")
          [ -z "$JWT_SECRET" ] && missing+=("JWT_SECRET")
          [ -z "$APP_URL" ] && missing+=("APP_URL")
          [ -z "$GOOGLE_CLIENT_ID" ] && missing+=("GOOGLE_CLIENT_ID")
          [ -z "$GOOGLE_CLIENT_SECRET" ] && missing+=("GOOGLE_CLIENT_SECRET")

          if [ ${#missing[@]} -gt 0 ]; then
            echo "::error::Missing required secrets: ${missing[*]}"
            echo ""
            echo "Please add these secrets in GitHub: Settings > Secrets and variables > Actions"
            echo "See README.md for setup instructions."
            exit 1
          fi
          echo "All required secrets are configured"

      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Setup Cloudflare resources
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          # Create D1 database if it doesn't exist
          echo "Checking D1 databases..."
          npx wrangler d1 list

          if ! npx wrangler d1 list 2>/dev/null | grep -q "neubofy-booking-db"; then
            echo "Creating D1 database..."
            npx wrangler d1 create neubofy-booking-db
          fi

          # Get database ID
          echo "Getting D1 database ID..."
          DB_ID=$(npx wrangler d1 list --json | jq -r '.[] | select(.name=="neubofy-booking-db") | .uuid')
          echo "D1 database ID: $DB_ID"

          if [ -n "$DB_ID" ] && [ "$DB_ID" != "null" ]; then
            sed -i "s/database_id = \"YOUR_DATABASE_ID\"/database_id = \"$DB_ID\"/" wrangler.toml
            echo "DB_ID=$DB_ID" >> $GITHUB_ENV
          else
            echo "ERROR: Could not get D1 database ID"
            exit 1
          fi

          # Create KV namespace if it doesn't exist.
          echo "Creating KV namespace..."
          npx wrangler kv namespace create neubofy-booking-kv >/tmp/kv-create.log 2>&1 || true

          # Get KV namespace ID from the list output
          echo "Getting KV namespace ID..."
          KV_LIST=$(npx wrangler kv namespace list --json)
          echo "$KV_LIST"
          KV_ID=$(echo "$KV_LIST" | jq -r '.[] | select(.title=="neubofy-booking-kv") | .id' | head -1)
          echo "KV namespace ID: $KV_ID"

          if [ -n "$KV_ID" ] && [ "$KV_ID" != "null" ]; then
            sed -i "s/id = \"YOUR_KV_NAMESPACE_ID\"/id = \"$KV_ID\"/" wrangler.toml
            echo "KV_ID=$KV_ID" >> $GITHUB_ENV
          else
            echo "ERROR: Could not get KV namespace ID"
            exit 1
          fi

          # Initialize only a brand-new database. schema.sql is the complete
          # current schema; replaying it on every deployment causes duplicate
          # index errors and makes migration failures invisible.
          TABLE_COUNT=$(npx wrangler d1 execute neubofy-booking-db --remote --command "SELECT COUNT(*) AS count FROM sqlite_master WHERE type = 'table' AND name NOT LIKE 'sqlite_%';" --json | jq -r '.[0].results[0].count // 0')
          if [ "$TABLE_COUNT" = "0" ]; then
            echo "Initializing new database schema..."
            npx wrangler d1 execute neubofy-booking-db --file=./schema.sql --remote
          else
            echo "Database already initialized with $TABLE_COUNT tables; skipping schema.sql"
          fi

          # Apply the organization upgrade only to installations created
          # before organization support. Older migrations are already present
          # in schema.sql and must never be replayed on production.
          ORG_TABLE=$(npx wrangler d1 execute neubofy-booking-db --remote --command "SELECT COUNT(*) AS count FROM sqlite_master WHERE type = 'table' AND name = 'organizations';" --json | jq -r '.[0].results[0].count // 0')
          if [ "$ORG_TABLE" = "0" ]; then
            echo "Applying organization access migration..."
            npx wrangler d1 execute neubofy-booking-db --file=./migrations/0009_organization_access.sql --remote
          else
            echo "Organization schema already present; skipping migration"
          fi

      - name: Build
        run: npm run build

      - name: Create Pages project if needed
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if ! npx wrangler pages project list 2>/dev/null | grep -q "neubofy-booking"; then
            echo "Creating Pages project..."
            npx wrangler pages project create neubofy-booking --production-branch=main || true
          fi

          # Clear any existing env vars to avoid conflicts with wrangler.toml
          echo "Clearing existing env vars..."
          curl -X PATCH "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/pages/projects/neubofy-booking" \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            -H "Content-Type: application/json" \
            --data '{"deployment_configs": {"production": {"env_vars": null}}}' || true

      - name: Deploy to Cloudflare Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          ADMIN_EMAIL: ${{ secrets.ADMIN_EMAIL }}
          APP_URL: ${{ secrets.APP_URL }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          EMAIL_FROM: ${{ secrets.EMAIL_FROM }}
          EMAIL_REPLY_TO: ${{ secrets.EMAIL_REPLY_TO }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          ORGANIZATION_OWNER_EMAIL: ${{ secrets.ORGANIZATION_OWNER_EMAIL }}
          MICROSOFT_CLIENT_ID: ${{ secrets.MICROSOFT_CLIENT_ID }}
          MICROSOFT_CLIENT_SECRET: ${{ secrets.MICROSOFT_CLIENT_SECRET }}
        run: |
          # Add env vars to wrangler.toml before deploy
          cat >> wrangler.toml << EOF

          [vars]
          ADMIN_EMAIL = "$ADMIN_EMAIL"
          APP_URL = "$APP_URL"
          GOOGLE_CLIENT_ID = "$GOOGLE_CLIENT_ID"
          GOOGLE_CLIENT_SECRET = "$GOOGLE_CLIENT_SECRET"
          JWT_SECRET = "$JWT_SECRET"
          RESEND_API_KEY = "$RESEND_API_KEY"
          EMAIL_FROM = "$EMAIL_FROM"
          EMAIL_REPLY_TO = "$EMAIL_REPLY_TO"
          CRON_SECRET = "$CRON_SECRET"
          MICROSOFT_CLIENT_ID = "$MICROSOFT_CLIENT_ID"
          MICROSOFT_CLIENT_SECRET = "$MICROSOFT_CLIENT_SECRET"
          ORGANIZATION_OWNER_EMAIL = "${ORGANIZATION_OWNER_EMAIL:-$ADMIN_EMAIL}"
          EOF

          npx wrangler pages deploy .svelte-kit/cloudflare --project-name=neubofy-booking --commit-dirty=true

      - name: Deploy Cron Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          APP_URL: ${{ secrets.APP_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          cd workers/cron-reminders

          # Deploy the worker
          npx wrangler deploy

          # Set secrets for the worker
          echo "$APP_URL" | npx wrangler secret put APP_URL
          echo "$CRON_SECRET" | npx wrangler secret put CRON_SECRET

          echo "Cron worker deployed with 5-minute schedule"
