name: Deploy to Cloudflare

"on":
  push:
    branches:
      - main
      - master
    paths:
      - 'src/**'
      - 'static/**'
      - 'scripts/**'
      - 'functions/**'
      - 'migrations/**'
      - 'schema.sql'
      - 'package.json'
      - 'package-lock.json'
      - 'wrangler.toml'
      - 'svelte.config.js'
      - 'vite.config.ts'
      - 'tailwind.config.js'
      - 'postcss.config.js'
      - 'tsconfig.json'
      - '.github/workflows/deploy.yml'
  workflow_dispatch:
    inputs:
      deploy_target:
        description: 'Component to deploy'
        required: true
        default: 'all'
        type: choice
        options:
          - all
          - pages
          - database

concurrency:
  group: production-deployment
  cancel-in-progress: false

jobs:
  # --------------------------------------------------------------------------
  # 1. CHANGE DETECTION JOB
  # Analyzes changed files to determine which jobs need to execute.
  # --------------------------------------------------------------------------
  detect-changes:
    name: Detect Changed Components
    runs-on: ubuntu-latest
    outputs:
      pages: ${{ steps.components.outputs.pages }}
      database: ${{ steps.components.outputs.database }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Detect Changes by Path
        uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            pages:
              - 'src/**'
              - 'static/**'
              - 'scripts/**'
              - 'functions/**'
              - 'package.json'
              - 'package-lock.json'
              - 'wrangler.toml'
              - 'svelte.config.js'
              - 'vite.config.ts'
              - 'tailwind.config.js'
              - 'postcss.config.js'
              - 'tsconfig.json'
              - '.github/workflows/deploy.yml'
            database:
              - 'migrations/**'
              - 'schema.sql'
              - '.github/workflows/deploy.yml'

      - name: Resolve Deploy Targets
        id: components
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TARGET="${{ inputs.deploy_target }}"
            echo "Manual workflow dispatch for target: $TARGET"
            if [ "$TARGET" = "all" ] || [ "$TARGET" = "pages" ]; then
              echo "pages=true" >> "$GITHUB_OUTPUT"
            else
              echo "pages=false" >> "$GITHUB_OUTPUT"
            fi
            if [ "$TARGET" = "all" ] || [ "$TARGET" = "database" ]; then
              echo "database=true" >> "$GITHUB_OUTPUT"
            else
              echo "database=false" >> "$GITHUB_OUTPUT"
            fi
          else
            echo "Auto push detection:"
            echo "pages=${{ steps.filter.outputs.pages }}" >> "$GITHUB_OUTPUT"
            echo "database=${{ steps.filter.outputs.database }}" >> "$GITHUB_OUTPUT"
          fi

  # --------------------------------------------------------------------------
  # 2. DATABASE MIGRATION JOB
  # Runs ONLY when schema.sql or migrations/ have changed.
  # --------------------------------------------------------------------------
  migrate-database:
    name: Apply Database Migrations
    needs: detect-changes
    if: needs.detect-changes.outputs.database == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Configure D1 Database ID
        env:
          D1_DATABASE_ID: ${{ secrets.D1_DATABASE_ID }}
        run: |
          if [ -z "$D1_DATABASE_ID" ]; then
            echo "::error::D1_DATABASE_ID secret is missing."
            exit 1
          fi
          sed -i "s/database_id = \"YOUR_DATABASE_ID\"/database_id = \"$D1_DATABASE_ID\"/" wrangler.toml

      - name: Execute D1 Migrations
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          echo "Applying consolidated master database schema to remote D1..."
          npx wrangler d1 execute neubofy-booking-db --file=./schema.sql --remote

  # --------------------------------------------------------------------------
  # 3. CLOUDFLARE PAGES DEPLOY JOB
  # Runs ONLY when web app code, static files, or build configs change.
  # --------------------------------------------------------------------------
  deploy-pages:
    name: Build & Deploy Pages
    needs: [detect-changes, migrate-database]
    if: always() && !cancelled() && needs.detect-changes.outputs.pages == 'true' && contains(fromJSON('["success", "skipped"]'), needs.migrate-database.result)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Configure Cloudflare IDs
        env:
          D1_DATABASE_ID: ${{ secrets.D1_DATABASE_ID }}
          KV_NAMESPACE_ID: ${{ secrets.KV_NAMESPACE_ID }}
        run: |
          if [ -n "$D1_DATABASE_ID" ]; then
            sed -i "s/database_id = \"YOUR_DATABASE_ID\"/database_id = \"$D1_DATABASE_ID\"/" wrangler.toml
          fi
          if [ -n "$KV_NAMESPACE_ID" ]; then
            sed -i "s/id = \"YOUR_KV_NAMESPACE_ID\"/id = \"$KV_NAMESPACE_ID\"/" wrangler.toml
          fi

      - name: Build SvelteKit Application
        run: npm run build

      - name: Deploy to Cloudflare Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          APP_URL: ${{ secrets.APP_URL }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          ORGANIZATION_OWNER_EMAIL: ${{ secrets.ORGANIZATION_OWNER_EMAIL }}
        run: |
          cat >> wrangler.toml << EOF

          [vars]
          APP_URL = "$APP_URL"
          GOOGLE_CLIENT_ID = "$GOOGLE_CLIENT_ID"
          GOOGLE_CLIENT_SECRET = "$GOOGLE_CLIENT_SECRET"
          JWT_SECRET = "$JWT_SECRET"
          RESEND_API_KEY = "$RESEND_API_KEY"
          ORGANIZATION_OWNER_EMAIL = "$ORGANIZATION_OWNER_EMAIL"
          EOF

          npx wrangler pages deploy .svelte-kit/cloudflare --project-name=neubofy-booking --commit-dirty=true
